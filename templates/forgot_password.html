<!DOCTYPE html>
<html lang="en"{% include "_html_attrs.html" %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password - Finance</title>
    {% include "_fonts.html" %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-split">
        <aside class="auth-panel">
            <a href="/" class="brand auth-brand">Finance</a>
            <div>
                <h2 class="auth-headline">Forgot your password?</h2>
                <p class="auth-lede">We'll email you a link to set a new one. It expires in an hour.</p>
            </div>
        </aside>

        <main class="auth-main">
            <div class="auth-form-wrap">
                <h1 class="auth-title">Reset password</h1>
                <p class="auth-sub">Enter the email on your account.</p>

                <form id="forgotForm" class="stack auth-form">
                    <label class="field">
                        <span>Email</span>
                        <input type="email" id="email" name="email" class="input" placeholder="you@example.com" required autofocus>
                    </label>
                    <div id="forgotError" class="form-error hidden"></div>
                    <div id="forgotSuccess" class="hidden" style="color:var(--status-positive);font-size:13px;margin:8px 0;"></div>
                    <button type="submit" class="btn btn-primary btn-block auth-submit">Send reset link</button>
                </form>

                <p class="auth-switch"><a href="/login" class="link">Back to sign in</a></p>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
