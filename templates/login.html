<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Financial Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-wallet"></i>
                <h1>Financial Manager</h1>
                <p>Sign in to your account</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div class="forgot-link">
                    <a href="#" onclick="openResetModal(); return false;">Forgot password?</a>
                </div>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="/signup">Create one</a></p>
            </div>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="resetModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2><i class="fas fa-key"></i> Reset Password</h2>
                <button class="modal-close" onclick="closeResetModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="resetEmail"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="resetEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="resetNewPassword"><i class="fas fa-lock"></i> New Password</label>
                    <input type="password" id="resetNewPassword" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label for="resetConfirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="resetConfirmPassword" placeholder="Confirm new password">
                </div>
                <div id="resetError" class="reset-error hidden"></div>
                <button class="btn btn-primary" onclick="submitReset()">
                    <i class="fas fa-check"></i> Reset Password
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Signing in...</p>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
