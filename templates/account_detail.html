{% extends "base.html" %}
{% block title %}Account - Finance{% endblock %}
{% block content %}
<div class="page" data-account-id="{{ account_id }}">
    <header class="page-head">
        <div>
            <a href="/accounts" class="back-link"><i class="icon-arrow-left"></i>All accounts</a>
            <h1 class="page-title" id="accountName">Loading&hellip;</h1>
            <p class="page-sub" id="accountMeta"></p>
        </div>
        <div class="page-actions">
            <div class="card" style="padding:20px 24px;text-align:right;">
                <div class="label" id="balanceLabel">Current balance</div>
                <div class="stat-value" id="accountBalance">&mdash;</div>
            </div>
        </div>
    </header>

    <div class="card card-flush table-wrap">
        <table class="table">
            <thead>
                <tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th><th>Type</th><th class="num">Balance</th></tr>
            </thead>
            <tbody id="txBody">
                <tr><td colspan="6" class="muted">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/account_detail.js') }}"></script>
{% endblock %}
